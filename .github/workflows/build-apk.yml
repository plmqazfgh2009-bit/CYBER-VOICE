
name: Build CYBER VOICE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find and extract project
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -oq "$ZIP_FILE" -d source

          PROJECT_DIR=$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build CYBER VOICE
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace --warning-mode all

      - name: Check APK
        run: |
          APK=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-VOICE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
